# Line selection: a click on new line 7 of code/main.go selects it and
# offers to copy code/main.go:7, in split then unified.
description: Diff line selection and its copy button
size: {width: 1400, height: 800}
steps:
  - click: markdown
  - click: Source Control
  - wait: code/main.go
  - click: code/main.go
  - wait: R7
  - click: R7
  - expect: [Copy code/main.go:7]
  - shot: split
  - click: Unified
  - expect: [Copy code/main.go:7]
  - shot: unified
web:
  storage: {servef-theme: "${theme}"}
  shots:
    split:
      path: /view?project=/home/user/markdown&review=working#f=code/main.go&R7
      steps:
        - click: {label: Split, by: label}
        - wait: code/main.go
    unified:
      path: /view?project=/home/user/markdown&review=working#f=code/main.go&R7
      steps:
        - click: {label: Unified, by: label}
        - wait: code/main.go
