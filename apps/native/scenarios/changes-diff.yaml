# Uncommitted changes (changes.json) and a modified file's diff
# (diff-modified.json), split then unified.
description: Changes list and code/main.go diff, split and unified
size: {width: 1100, height: 700}
steps:
  - click: markdown
  - click: Changes
  - wait: code/main.go
  - click: code/main.go
  - wait: Diff layout
  - shot: split
  - click: Unified
  - shot: unified
web:
  storage: {servef-theme: "${theme}"}
  shots:
    split:
      path: /view?project=/home/user/markdown&review=working#f=code/main.go
      steps:
        - click: {label: Split, by: label}
        - wait: code/main.go
    unified:
      path: /view?project=/home/user/markdown&review=working#f=code/main.go
      steps:
        - click: {label: Unified, by: label}
        - wait: code/main.go
