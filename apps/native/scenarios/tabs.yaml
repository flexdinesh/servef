# Editor tabs (decisions 0035, 0056): three documents open from the tree,
# the active one on the document surface; a narrow window scrolls the
# strip to keep the active tab in view; closing the active tab shows its
# left neighbor. The web restores the same tabs from its memory.
description: Tabs open, overflow, and close
size: {width: 1100, height: 700}
steps:
  - click: markdown
  - click: guides
  - click: getting-started.md
  - click: config
  - click: settings.json
  - click: broken.json
  - wait: Close config/broken.json
  - shot: tabs
  - resize: {width: 640, height: 700}
  - shot: overflow
  - resize: {width: 1100, height: 700}
  - click: Close config/broken.json
  - wait: config/settings.json
  - shot: closed
web:
  storage: {servef-theme: "${theme}", servef-workspaces-v2: '{"last":{"/home/user/markdown":"/home/user/markdown"},"projects":{"/home/user/markdown":{"tabs":["guides/getting-started.md","config/settings.json","config/broken.json"],"active":"config/broken.json"}}}'}
  shots:
    tabs:
      path: /view?project=/home/user/markdown&path=config/broken.json
      steps:
        - wait: broken.json
    overflow:
      path: /view?project=/home/user/markdown&path=config/broken.json
      steps:
        - wait: broken.json
    closed:
      path: /view?project=/home/user/markdown&path=config/broken.json
      steps:
        - click: {label: Close config/broken.json, by: label}
        - wait: {ms: 500}
