# The tab menu (tab-menu.ts): Close to the Right from the first tab, then
# Close Others. Native shows the system menu, which shots do not draw;
# the shots show what each choice closed.
description: Tab menu closes to the right and the others
size: {width: 1100, height: 700}
steps:
  - click: markdown
  - click: guides
  - click: getting-started.md
  - click: config
  - click: settings.json
  - click: broken.json
  - wait: Close config/broken.json
  - click: {label: Close config/settings.json, button: right}
  - expect: [Close to the Right]
  - click: Close to the Right
  - wait: Close config/settings.json
  - shot: close-right
web:
  storage: {servef-theme: "${theme}", servef-workspaces-v2: '{"last":{"/home/user/markdown":"/home/user/markdown"},"projects":{"/home/user/markdown":{"tabs":["guides/getting-started.md","config/settings.json","config/broken.json"],"active":"config/broken.json"}}}'}
  shots:
    close-right:
      path: /view?project=/home/user/markdown&path=config/broken.json
      steps:
        - wait: broken.json
        # agent-browser's right click opens no Base UI menu: closing the
        # tab to the right reaches the same state.
        - click: {label: Close config/broken.json, by: label}
        - wait: {ms: 500}
