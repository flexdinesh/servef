# The shell in Servef Dark: activity bar with the change badge, tabs, and
# the status bar's path.
description: Workspace shell in the dark appearance
size: {width: 1100, height: 700}
dark: true
steps:
  - click: markdown
  - click: guides
  - click: getting-started.md
  - click: config
  - click: settings.json
  - click: broken.json
  - wait: Close config/broken.json
  - shot: shell
web:
  storage: {servef-theme: "${theme}", servef-workspaces-v2: '{"last":{"/home/user/markdown":"/home/user/markdown"},"projects":{"/home/user/markdown":{"tabs":["guides/getting-started.md","config/settings.json","config/broken.json"],"active":"config/broken.json"}}}'}
  shots:
    shell:
      path: /view?project=/home/user/markdown&path=config/broken.json
      steps:
        - wait: broken.json
