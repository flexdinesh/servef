# Hunk steps: Next change twice selects notes/hunks.txt's second hunk, as
# F7 does; the web side opens the same selection by its anchor.
description: Diff hunk step selects the second hunk
size: {width: 1400, height: 800}
steps:
  - click: markdown
  - click: Source Control
  - wait: notes/hunks.txt
  - click: notes/hunks.txt
  - wait: 9 unmodified lines
  - click: Next change
  - click: Next change
  - expect: [Copy notes/hunks.txt:16-23]
  - shot: second-hunk
web:
  storage: {servef-theme: "${theme}"}
  shots:
    second-hunk:
      path: /view?project=/home/user/markdown&review=working#f=notes/hunks.txt&R16-R23
      steps:
        - wait: notes/hunks.txt
        - click: {label: Split, by: label}
        - wait: {ms: 1500}
