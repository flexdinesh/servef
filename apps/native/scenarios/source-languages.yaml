# Highlights in the Source view (decision 0088): JavaScript (page-js.json)
# and CSS (page-css.json), colored by the web app's syntax theme.
description: Source view of code/app.js and code/styles.css
size: {width: 1100, height: 700}
steps:
  - click: markdown
  - click: code
  - click: app.js
  - wait: code/app.js
  - shot: javascript
  - click: styles.css
  - wait: code/styles.css
  - shot: css
web:
  storage: {servef-theme: "${theme}"}
  shots:
    javascript:
      path: /view?project=/home/user/markdown&path=code/app.js
      steps:
        - wait: js-search-token
    css:
      path: /view?project=/home/user/markdown&path=code/styles.css
      steps:
        - wait: css-search-token
