# Projects of this computer: the daemon's served roots (fixtures:
# projects.json). The web UI lists them in the project picker.
description: Project list of this computer
size: {width: 1100, height: 700}
steps:
  - wait: /home/user/markdown
  - expect: [markdown, "notes  ·  main", "blog  ·  draft"]
  - shot: projects
web:
  storage: {servef-theme: "${theme}"}
  shots:
    projects:
      path: /view?project=/home/user/markdown
      steps:
        - click: {label: "Switch project (markdown)", by: label}
        - wait: notes
