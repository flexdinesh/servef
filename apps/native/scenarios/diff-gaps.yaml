# Collapsed gaps of notes/hunks.txt (diff-hunks.json): three hunks, a
# nine-line gap that expands in place, a one-line gap that always shows,
# and a last line without a newline.
description: Diff gaps collapsed, then one expanded in place
size: {width: 1400, height: 800}
steps:
  - click: markdown
  - click: Changes
  - wait: notes/hunks.txt
  - click: notes/hunks.txt
  - wait: 9 unmodified lines
  - shot: gaps
  - click: 9 unmodified lines
  - wait: line 12
  - shot: gap-expanded
web:
  storage: {servef-theme: "${theme}"}
  shots:
    gaps:
      path: /view?project=/home/user/markdown&review=working#f=notes/hunks.txt
      steps:
        - wait: notes/hunks.txt
        - click: {label: Split, by: label}
        - wait: {ms: 1500}
    gap-expanded:
      path: /view?project=/home/user/markdown&review=working#f=notes/hunks.txt
      steps:
        - wait: notes/hunks.txt
        - click: {label: Split, by: label}
        - wait: {ms: 1500}
        # Pierre renders in a shadow DOM that selectors do not reach: click
        # the "9 unmodified lines" text by position.
        - click: {x: 452, y: 242}
        - settle: {}
