# Servef Dark: the document preview and the diff in the dark appearance.
description: Dark appearance of a preview and a diff
size: {width: 1100, height: 700}
dark: true
steps:
  - click: markdown
  - click: guides
  - click: getting-started.md
  - click: Preview
  - wait: Getting started
  - shot: preview-dark
  - click: Source Control
  - click: code/main.go
  - wait: Diff layout
  - shot: diff-dark
web:
  storage: {servef-theme: "${theme}"}
  shots:
    preview-dark:
      path: /view?project=/home/user/markdown&path=guides/getting-started.md
      steps:
        - click: Preview
        - wait: frontend-only fixture API
    diff-dark:
      path: /view?project=/home/user/markdown&review=working#f=code/main.go
      steps:
        - click: {label: Split, by: label}
        - wait: code/main.go
