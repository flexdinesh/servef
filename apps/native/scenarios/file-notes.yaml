# What the server's capabilities leave of a file: binary (page-binary.json),
# over the read limit (page-too-large.json), and over the preview limit
# (page-large.json).
description: Binary, too-large, and large-file notes
size: {width: 1100, height: 700}
steps:
  - click: markdown
  - click: assets
  - click: sample.bin
  - wait: Binary file
  - shot: binary
  - click: logs
  - click: enormous.log
  - wait: Too large to display
  - shot: too-large
  - click: huge.log
  - wait: logs/huge.log
  - shot: large
web:
  storage: {servef-theme: "${theme}"}
  shots:
    binary:
      path: /view?project=/home/user/markdown&path=assets/sample.bin
      steps:
        - wait: Binary file
    too-large:
      path: /view?project=/home/user/markdown&path=logs/enormous.log
      steps:
        - wait: Too large to display
    large:
      path: /view?project=/home/user/markdown&path=logs/huge.log
      steps:
        - wait: preview and formatting are off
