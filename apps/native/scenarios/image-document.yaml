# An image file (page-image.json, raw-preview.png): fitted, then zoomed.
description: Image document with zoom controls
size: {width: 1100, height: 700}
steps:
  - click: markdown
  - click: assets
  - click: preview.png
  - wait: Fit
  - shot: fit
  - click: Zoom in
  - click: Zoom in
  - shot: zoomed
web:
  storage: {servef-theme: "${theme}"}
  shots:
    fit:
      path: /view?project=/home/user/markdown&path=assets/preview.png
      steps:
        - wait: Fit
    zoomed:
      path: /view?project=/home/user/markdown&path=assets/preview.png
      steps:
        - click: {label: Zoom in, by: label}
        - click: {label: Zoom in, by: label}
