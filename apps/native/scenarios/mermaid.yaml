# Mermaid through Ondine (decision 0088): a document's fences
# (page-diagrams.json: flowchart, sequence, state, git graph, and a syntax
# error that shows its source and Ondine's diagnostic) and a .mmd file
# (page-mermaid.json).
description: Mermaid diagrams in guides/diagrams.md and guides/request-flow.mmd
size: {width: 1100, height: 900}
steps:
  - click: markdown
  - click: guides
  - click: diagrams.md
  - click: Preview
  - wait: Mermaid diagram
  - shot: diagrams
  - scroll: {label: Page load, dy: 4000}
  - wait: Syntax error fallback
  - shot: error
  - click: request-flow.mmd
  - wait: Mermaid diagram
  - shot: mmd
web:
  storage: {servef-theme: "${theme}"}
  shots:
    diagrams:
      path: /view?project=/home/user/markdown&path=guides/diagrams.md
      steps:
        - click: Preview
        - wait: Mermaid diagrams
    error:
      path: /view?project=/home/user/markdown&path=guides/diagrams.md
      steps:
        - click: Preview
        - wait: Syntax error fallback
        # Clicking the heading scrolls the document pane to it.
        - click: Syntax error fallback
    mmd:
      path: /view?project=/home/user/markdown&path=guides/request-flow.mmd
      steps:
        - click: {label: '[role=tab]', by: css}
        - wait: Original text
