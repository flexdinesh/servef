# Dev tooling and task orchestration (decision 0038). Composite tasks live
# here; package.json keeps single JS steps.

# Lockfile format and go.mod/packageManager reading need a recent mise. Bump
# with jdx/mise-action `version` in .github/workflows.
min_version = "2026.10.18"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]
# Matches pnpm-workspace.yaml minimumReleaseAge.
minimum_release_age = "3d"
# Node from .node-version (nvm reads it too); pnpm from package.json
# packageManager.
idiomatic_version_file_enable_tools = ["node", "pnpm"]

[tools]
# go.mod and go.work `go` lines stay the language minimum; mise.lock pins the patch.
go = "1.26"
dagger = "0.21.10"

[env]
# Local overrides such as dev ports; see .env.example. Missing is fine.
_.file = ".env"

[tasks.setup]
description = "Install dependencies and build embedded frontend assets"
run = ["go mod download", "pnpm install", { task = "build:web" }]

# Development

[tasks.dev]
description = "Run Go and Vite together"
run = [{ tasks = ["dev:server", "dev:web", "dev:walkthroughs"] }]

# The browser tests' git fixture, rebuilt in the gitignored .dev on each start,
# gives Source Control a repository beside testdata/markdown. Walkthroughs are
# stored in .dev/cache, not the user cache; Go keeps its own build cache.
[tasks."dev:server"]
description = "Run only the Go server"
env = { SERVEF_BROWSER_GIT_ROOT = "{{config_root}}/.dev/git-fixture" }
run = [
  "node tests/browser/git-fixture.ts",
  "GOCACHE=\"$(go env GOCACHE)\" XDG_CACHE_HOME=\"{{config_root}}/.dev/cache\" go run ./apps/servef testdata/markdown --path \"$SERVEF_BROWSER_GIT_ROOT\" --port ${SERVEF_DEV_SERVER_PORT:-8080} --no-open",
]

[tasks."dev:walkthroughs"]
description = "Publish sample walkthroughs once the Go server is up"
env = { SERVEF_BROWSER_GIT_ROOT = "{{config_root}}/.dev/git-fixture" }
run = "node scripts/dev-walkthroughs.ts"

[tasks."dev:web"]
description = "Run only Vite against the Go server"
run = "pnpm dev:web"

# The desktop app runs against its own daemon, socket, roots, page state, and
# walkthrough cache in the gitignored .dev/desktop and .dev/cache; it never
# touches the user's daemon. apps/desktop needs Go 1.27 (GOTOOLCHAIN fetches it)
# and, on Linux, WebKitGTK 4.1.
[tasks."dev:desktop"]
description = "Run the desktop app against a private dev daemon"
depends = ["build:web"]
env = { SERVEF_DESKTOP_BINARY = "{{config_root}}/.dev/desktop/servef", SERVEF_DESKTOP_SOCKET = "{{config_root}}/.dev/desktop/daemon.sock", SERVEF_DESKTOP_ROOTS_FILE = "{{config_root}}/.dev/desktop/roots.json", MYGO_ENV = "production" }
run = [
  "go build -o .dev/desktop/servef ./apps/servef",
  "GOWORK=off GOTOOLCHAIN=go1.27.3 go -C apps/desktop build -o \"{{config_root}}/.dev/desktop/servef-desktop\" .",
  "XDG_DATA_HOME=\"{{config_root}}/.dev/desktop/data\" XDG_CACHE_HOME=\"{{config_root}}/.dev/cache\" .dev/desktop/servef-desktop",
]

[tasks."dev:mock"]
description = "Run Vite with API fixtures"
run = "pnpm dev:mock"

[tasks."dev:site"]
description = "Run the docs dev server"
run = "pnpm dev:site"

# Builds

[tasks."build:web"]
description = "Build embedded frontend assets; skipped when inputs are unchanged"
run = "pnpm build:web"
sources = [
  "apps/web/src/**/*",
  "packages/contracts/**/*",
  "patches/**/*",
  "apps/web/dev-server.ts",
  "apps/web/index.html",
  "apps/web/package.json",
  "apps/web/tsconfig.json",
  "apps/web/vite.config.ts",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
]
outputs = ["apps/servef/internal/web/dist/**/*"]

[tasks."build:go"]
description = "Build all Go packages"
depends = ["build:web"]
run = "go build ./apps/servef/... ./tools/..."

[tasks."build:site"]
description = "Build the docs site; skipped when inputs are unchanged"
run = "pnpm build:site"
sources = [
  "apps/site/src/**/*",
  "apps/site/package.json",
  "apps/site/tsconfig.json",
  "apps/site/vocs.config.ts",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
]
outputs = ["apps/site/dist/**/*"]

[tasks.install]
description = "Install the local CLI with go install"
depends = ["build:web"]
run = "go install ./apps/servef"

# Public checks snapshot current edits. Container leaves never call these wrappers.

[tasks."fmt:check"]
description = "Run fmt:check against a private current-edit snapshot"
run = "go run ./tools/validate working --group repo --task _host:fmt:check"

[tasks."tidy:check"]
description = "Run tidy:check against a private current-edit snapshot"
run = "go run ./tools/validate working --group repo --task _host:tidy:check"

[tasks."mise:check"]
description = "Run mise:check against a private current-edit snapshot"
run = "go run ./tools/validate working --group repo --task _host:mise:check"

[tasks."contracts:check"]
description = "Run contracts:check against a private current-edit snapshot"
run = "go run ./tools/validate working --group repo --task _host:contracts:check"

# Writes packages/contracts from apps/servef/pkg/contract (decision 0080); a
# host operation like formatting.
[tasks."contracts:generate"]
description = "Generate packages/contracts from apps/servef/pkg/contract"
run = "go run ./tools/contracts"

[tasks."vet"]
description = "Run vet against a private current-edit snapshot"
run = "go run ./tools/validate working --group go --task _container:vet"

[tasks."test:go"]
description = "Run test:go against a private current-edit snapshot"
run = "go run ./tools/validate working --group go --task _container:test:go"

[tasks."test:race"]
description = "Run test:race against a private current-edit snapshot"
run = "go run ./tools/validate working --group go --task _container:test:race"

[tasks."test:web"]
description = "Run test:web against a private current-edit snapshot"
run = "go run ./tools/validate working --group frontend --task _container:test:web"

[tasks."test:release"]
description = "Run test:release against a private current-edit snapshot"
run = "go run ./tools/validate working --group tooling --task _container:test:release"

[tasks."test:browser"]
description = "Run test:browser against a private current-edit snapshot"
run = "go run ./tools/validate working --group browser --task _container:test:browser"

[tasks."test:browser:webkit"]
description = "Run the browser tests on Playwright WebKit (opt-in, not in check:pr)"
run = "go run ./tools/validate working --group webkit --task _container:test:browser:webkit"

[tasks."test:browser:extended"]
description = "Run extended Chromium checks against a private current-edit snapshot"
run = "go run ./tools/validate working --group browser-extended --task _container:test:browser:extended"

[tasks."test:desktop"]
description = "Run the desktop app's unit tests against a private current-edit snapshot"
run = "go run ./tools/validate working --group desktop --task _container:test:desktop"

[tasks."test:desktop:e2e"]
description = "Drive the built desktop app under Xvfb against a private current-edit snapshot"
alias = "desktop:e2e"
run = "go run ./tools/validate working --group desktop --task _container:test:desktop:e2e"

[tasks."test:desktop:extended"]
description = "Run extended desktop e2e checks against a private current-edit snapshot"
run = "go run ./tools/validate working --group desktop-extended --task _container:test:desktop:extended"

[tasks."lint"]
description = "Lint web in a private current-edit snapshot"
run = "go run ./tools/validate working --group web-static --task _host:lint"

[tasks.typecheck]
description = "Type-check all workspaces in private host snapshots"
run = [
  "go run ./tools/validate working --group web-static --task _host:typecheck:web",
  "go run ./tools/validate working --group tooling-static --task _host:typecheck:root",
  "go run ./tools/validate working --group site-static --task _host:typecheck:site",
]

[tasks."check:pr"]
description = "Validate clean committed HEAD before PR work"
run = "go run ./tools/validate validate"

[tasks."check"]
description = "Validate clean committed HEAD before PR work"
run = "go run ./tools/validate validate"

[tasks."check:full"]
description = "Validate correctness and extended checks against clean committed HEAD"
run = "go run ./tools/validate validate --suite full"

[tasks."check:extended"]
description = "Validate extended checks against clean committed HEAD"
run = "go run ./tools/validate validate --suite extended"

[tasks."validate"]
description = "Validate clean committed HEAD before PR work"
run = "go run ./tools/validate validate"

[tasks."check:status"]
description = "Verify current committed input coverage without running checks"
run = "go run ./tools/validate status"

[tasks."validate:status"]
description = "Verify current committed input coverage without running checks"
run = "go run ./tools/validate status"

[tasks."check:prune"]
description = "Prune completed local validation artifacts"
run = "go run ./tools/validate prune"

[tasks."validate:prune"]
description = "Prune completed local validation artifacts"
run = "go run ./tools/validate prune"

# Host leaves run only in coordinator-owned snapshots.
[tasks."_host:repo"]
hide = true
run = "node scripts/check.ts _host:fmt:check _host:tidy:check _host:mise:check _host:contracts:check"

[tasks."_host:web-static"]
hide = true
run = "node scripts/check.ts _host:typecheck:web _host:lint"

[tasks."_host:tooling-static"]
hide = true
run = "pnpm exec tsc --noEmit"

[tasks."_host:site-static"]
hide = true
run = "pnpm --filter @servef/site typecheck"

[tasks."_container:go"]
hide = true
run = "node scripts/check.ts _container:vet _container:test:race"

[tasks."_container:frontend"]
hide = true
run = "pnpm test:web"

[tasks."_container:tooling"]
hide = true
run = "shellcheck -s sh scripts/*.sh && pnpm test:release"

[tasks."_container:docs"]
hide = true
run = "pnpm build:site"

[tasks."_container:browser"]
hide = true
run = "pnpm exec node scripts/test-browser.ts --project=chromium --grep-invert @extended"

[tasks."_container:browser-extended"]
hide = true
env = { SERVEF_BROWSER_EXTENDED = "1" }
run = "pnpm exec node scripts/test-browser.ts --project=chromium --grep @extended"

[tasks."_container:webkit"]
hide = true
run = "pnpm exec node scripts/test-browser.ts --project=webkit --grep-invert @extended"

[tasks."_container:binary"]
hide = true
run = "go build -buildvcs=false -o /out/servef ./apps/servef"

[tasks."_host:tidy:check"]
hide = true
run = "go -C apps/servef mod tidy -diff && go -C tools mod tidy -diff"

[tasks."_container:vet"]
hide = true
run = "go vet ./apps/servef/... ./tools/..."

[tasks."_container:test:web"]
hide = true
run = "pnpm test:web"

[tasks."_container:test:release"]
hide = true
run = "shellcheck -s sh scripts/*.sh && pnpm test:release"

[tasks."_container:test:browser"]
hide = true
run = "pnpm exec node scripts/test-browser.ts --project=chromium --grep-invert @extended"

[tasks."_container:test:browser:extended"]
hide = true
env = { SERVEF_BROWSER_EXTENDED = "1" }
run = "pnpm exec node scripts/test-browser.ts --project=chromium --grep @extended"

# Opt-in WebKit compatibility run; never part of check:pr.
[tasks."_container:test:browser:webkit"]
hide = true
run = "pnpm exec node scripts/test-browser.ts --project=webkit --grep-invert @extended"

# The desktop app (decision 0095): its own Go 1.27 module outside go.work.
# SERVEF_DESKTOP_GOROOT is the container's Go 1.27; mise's GOROOT points at the
# locked Go. The group runs the unit tests, then the built app on Xvfb, Mesa,
# GTK, and WebKitGTK; artifacts in /out/desktop-e2e.
[tasks."_container:desktop"]
hide = true
run = "bash -ec 'shellcheck -s sh apps/desktop/scripts/*.sh; export GOROOT=$SERVEF_DESKTOP_GOROOT PATH=$SERVEF_DESKTOP_GOROOT/bin:$PATH; go -C apps/desktop mod tidy -diff; go -C apps/desktop vet ./...; go -C apps/desktop vet -tags e2e ./...; go -C apps/desktop test -race -count=1 ./...; SERVEF_DESKTOP_E2E_OUT=/out/desktop-e2e xvfb-run -a --server-args=\"-screen 0 1280x800x24\" dbus-run-session -- sh apps/desktop/scripts/e2e.sh'"

[tasks."_container:test:desktop"]
hide = true
run = "bash -ec 'shellcheck -s sh apps/desktop/scripts/*.sh; export GOROOT=$SERVEF_DESKTOP_GOROOT PATH=$SERVEF_DESKTOP_GOROOT/bin:$PATH; go -C apps/desktop mod tidy -diff; go -C apps/desktop vet ./...; go -C apps/desktop vet -tags e2e ./...; go -C apps/desktop test -race -count=1 ./...'"

[tasks."_container:test:desktop:e2e"]
hide = true
run = "bash -ec 'export GOROOT=$SERVEF_DESKTOP_GOROOT PATH=$SERVEF_DESKTOP_GOROOT/bin:$PATH; SERVEF_DESKTOP_E2E_OUT=/out/desktop-e2e xvfb-run -a --server-args=\"-screen 0 1280x800x24\" dbus-run-session -- sh apps/desktop/scripts/e2e.sh'"

[tasks."_container:desktop-extended"]
hide = true
env = { SERVEF_DESKTOP_EXTENDED = "1" }
run = "bash -ec 'export GOROOT=$SERVEF_DESKTOP_GOROOT PATH=$SERVEF_DESKTOP_GOROOT/bin:$PATH; SERVEF_DESKTOP_E2E_OUT=/out/desktop-e2e xvfb-run -a --server-args=\"-screen 0 1280x800x24\" dbus-run-session -- sh apps/desktop/scripts/e2e.sh'"

[tasks."_container:test:desktop:extended"]
hide = true
env = { SERVEF_DESKTOP_EXTENDED = "1" }
run = "bash -ec 'export GOROOT=$SERVEF_DESKTOP_GOROOT PATH=$SERVEF_DESKTOP_GOROOT/bin:$PATH; SERVEF_DESKTOP_E2E_OUT=/out/desktop-e2e xvfb-run -a --server-args=\"-screen 0 1280x800x24\" dbus-run-session -- sh apps/desktop/scripts/e2e.sh'"

[tasks."_container:build:site"]
hide = true
run = "pnpm build:site"

[tasks."_host:typecheck:web"]
hide = true
run = "pnpm --filter @servef/web typecheck"

[tasks."_host:typecheck:root"]
hide = true
run = "pnpm exec tsc --noEmit"

[tasks."_host:typecheck:site"]
hide = true
run = "pnpm --filter @servef/site typecheck"

[tasks."_host:lint"]
hide = true
run = "pnpm --filter @servef/web lint"

[tasks."_host:fmt:check"]
hide = true
shell = "bash -e -o pipefail -c"
run = '''
unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
if [ -n "$unformatted" ]; then
  printf '%s\n' "$unformatted" >&2
  exit 1
fi
'''

[tasks."_host:mise:check"]
hide = true
run = ["mise tasks validate", "mise fmt --check"]

[tasks."_host:contracts:check"]
hide = true
run = "go run ./tools/contracts -check"

[tasks."_container:test:go"]
hide = true
run = "node -e 'const p=require(\"./node_modules/typescript/package.json\"); if(p.name !== \"typescript\" || Number(p.version.split(\".\")[0]) < 7) throw new Error(\"native TypeScript is required for Go navigation tests\")' && test -x node_modules/typescript/bin/tsc && node_modules/typescript/bin/tsc --version && bash -c 'if [ \"$#\" -eq 0 ]; then set -- ./apps/servef/... ./tools/...; fi; exec go test -count=1 \"$@\"' go-test"

[tasks."_container:test:race"]
hide = true
run = "node -e 'const p=require(\"./node_modules/typescript/package.json\"); if(p.name !== \"typescript\" || Number(p.version.split(\".\")[0]) < 7) throw new Error(\"native TypeScript is required for Go navigation tests\")' && test -x node_modules/typescript/bin/tsc && node_modules/typescript/bin/tsc --version && bash -c 'if [ \"$#\" -eq 0 ]; then set -- ./apps/servef/... ./tools/...; fi; exec go test -race -count=1 \"$@\"' go-test"
