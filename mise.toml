# Dev tooling and task orchestration (decision 0038). Composite tasks live
# here; package.json keeps single JS steps.

# Lockfile format and go.mod/packageManager reading need a recent mise. Bump
# with jdx/mise-action `version` in .github/workflows.
min_version = "2026.10.18"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]
# Matches pnpm-workspace.yaml minimumReleaseAge.
minimum_release_age = "3d"
# Node from .node-version (nvm reads it too); pnpm from package.json
# packageManager.
idiomatic_version_file_enable_tools = ["node", "pnpm"]

[tools]
# go.mod's `go` line stays the language minimum; mise.lock pins the patch.
go = "1.26"
dagger = "0.21.10"

[env]
# Local overrides such as dev ports; see .env.example. Missing is fine.
_.file = ".env"

[tasks.setup]
description = "Install dependencies and build embedded frontend assets"
run = ["go mod download", "pnpm install", { task = "build:web" }]

# Development

[tasks.dev]
description = "Run Go and Vite together"
run = [{ tasks = ["dev:server", "dev:web", "dev:walkthroughs"] }]

# The browser tests' git fixture, rebuilt in the gitignored .dev on each start,
# gives Source Control a repository beside testdata/markdown. Walkthroughs are
# stored in .dev/cache, not the user cache; Go keeps its own build cache.
[tasks."dev:server"]
description = "Run only the Go server"
env = { SERVEF_BROWSER_GIT_ROOT = "{{config_root}}/.dev/git-fixture" }
run = [
  "node tests/browser/git-fixture.ts",
  "GOCACHE=\"$(go env GOCACHE)\" XDG_CACHE_HOME=\"{{config_root}}/.dev/cache\" go run . testdata/markdown --path \"$SERVEF_BROWSER_GIT_ROOT\" --port ${SERVEF_DEV_SERVER_PORT:-8080} --no-open",
]

[tasks."dev:walkthroughs"]
description = "Publish sample walkthroughs once the Go server is up"
env = { SERVEF_BROWSER_GIT_ROOT = "{{config_root}}/.dev/git-fixture" }
run = "node scripts/dev-walkthroughs.ts"

[tasks."dev:web"]
description = "Run only Vite against the Go server"
run = "pnpm dev:web"

[tasks."dev:mock"]
description = "Run Vite with API fixtures"
run = "pnpm dev:mock"

[tasks."dev:site"]
description = "Run the docs dev server"
run = "pnpm dev:site"

# Builds

[tasks."build:web"]
description = "Build embedded frontend assets; skipped when inputs are unchanged"
run = "pnpm build:web"
sources = [
  "patches/**/*",
  "web/src/**/*",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "web/dev-server.ts",
  "web/index.html",
  "web/package.json",
  "web/tsconfig.json",
  "web/vite.config.ts",
]
outputs = ["internal/web/dist/**/*"]

[tasks."build:go"]
description = "Build all Go packages"
depends = ["build:web"]
run = "go build ./..."

[tasks."build:site"]
description = "Build the docs site; skipped when inputs are unchanged"
run = "pnpm build:site"
sources = [
  "site/src/**/*",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "site/package.json",
  "site/tsconfig.json",
  "site/vocs.config.ts",
]
outputs = ["site/dist/**/*"]

[tasks.install]
description = "Install the local CLI with go install"
depends = ["build:web"]
run = "go install ."

# Checks validate committed snapshots; hidden leaves run in containers.

[tasks."fmt:check"]
description = "Run fmt:check in an isolated committed snapshot"
run = "go run ./tools/validate validate --group go --task _validate:fmt:check"

[tasks."tidy:check"]
description = "Run tidy:check in an isolated committed snapshot"
run = "go run ./tools/validate validate --group go --task _validate:tidy:check"

[tasks."mise:check"]
description = "Run mise:check in an isolated committed snapshot"
run = "go run ./tools/validate validate --group tooling --task _validate:mise:check"

[tasks."vet"]
description = "Run vet in an isolated committed snapshot"
run = "go run ./tools/validate validate --group go --task _validate:vet"

[tasks."test:go"]
description = "Run test:go in an isolated committed snapshot"
run = "go run ./tools/validate validate --group go --task _validate:test:go"

[tasks."test:race"]
description = "Run test:race in an isolated committed snapshot"
run = "go run ./tools/validate validate --group go --task _validate:test:race"

[tasks."test:web"]
description = "Run test:web in an isolated committed snapshot"
run = "go run ./tools/validate validate --group frontend --task _validate:test:web"

[tasks."test:release"]
description = "Run test:release in an isolated committed snapshot"
run = "go run ./tools/validate validate --group tooling --task _validate:test:release"

[tasks."test:browser"]
description = "Run test:browser in an isolated committed snapshot"
run = "go run ./tools/validate validate --group browser --task _validate:test:browser"

[tasks."lint"]
description = "Run lint in an isolated committed snapshot"
run = "go run ./tools/validate validate --group frontend --task _validate:lint"

[tasks.typecheck]
description = "Type-check all TypeScript workspaces in isolated snapshots"
run = [
  "go run ./tools/validate validate --group frontend --task _validate:typecheck:web",
  "go run ./tools/validate validate --group tooling --task _validate:typecheck:root",
  "go run ./tools/validate validate --group docs --task _validate:typecheck:site",
]

[tasks.check]
description = "Validate everything in local Dagger containers"
run = "go run ./tools/validate validate"

[tasks."check:full"]
description = "Validate everything in local Dagger containers"
run = "go run ./tools/validate validate"

# Container leaves. Dagger supplies immutable preparation and private state.
[tasks."_validate:go"]
hide = true
run = "node scripts/check.ts _validate:fmt:check _validate:tidy:check _validate:vet _validate:test:go _validate:test:race"

[tasks."_validate:frontend"]
hide = true
run = "node scripts/check.ts _validate:test:web _validate:typecheck:web _validate:lint"

[tasks."_validate:tooling"]
hide = true
run = "node scripts/check.ts _validate:test:release _validate:typecheck:root _validate:mise:check"

[tasks."_validate:docs"]
hide = true
run = "node scripts/check.ts _validate:typecheck:site _validate:build:site"

[tasks."_validate:browser"]
hide = true
run = "pnpm exec node scripts/test-browser.ts"

[tasks."_validate:binary"]
hide = true
run = "go build -buildvcs=false -o /out/servef ."

[tasks."_validate:fmt:check"]
hide = true
shell = "bash -e -o pipefail -c"
run = '''
unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
if [ -n "$unformatted" ]; then
  printf '%s\n' "$unformatted" >&2
  exit 1
fi
'''

[tasks."_validate:tidy:check"]
hide = true
run = "go mod tidy -diff"

[tasks."_validate:vet"]
hide = true
run = "go vet ./..."

[tasks."_validate:test:go"]
hide = true
run = "go test -count=1 ./..."

[tasks."_validate:test:race"]
hide = true
run = "go test -race -count=1 ./..."

[tasks."_validate:test:web"]
hide = true
run = "pnpm test:web"

[tasks."_validate:test:release"]
hide = true
run = "pnpm test:release"

[tasks."_validate:test:browser"]
hide = true
run = "pnpm exec node scripts/test-browser.ts"

[tasks."_validate:typecheck:web"]
hide = true
run = "pnpm --filter @servef/web typecheck"

[tasks."_validate:typecheck:root"]
hide = true
run = "pnpm exec tsc --noEmit"

[tasks."_validate:typecheck:site"]
hide = true
run = "pnpm --filter @servef/site typecheck"

[tasks."_validate:lint"]
hide = true
run = "pnpm lint"

[tasks."_validate:mise:check"]
hide = true
run = ["mise tasks validate", "mise fmt --check"]

[tasks."_validate:build:site"]
hide = true
run = "pnpm build:site"

[tasks.validate]
description = "Validate committed HEAD in isolated local Dagger containers"
run = "go run ./tools/validate validate"

[tasks."validate:status"]
description = "Show successful validation coverage for current HEAD inputs"
run = "go run ./tools/validate status"

[tasks."validate:prune"]
description = "Remove old completed local validation artifacts"
run = "go run ./tools/validate prune"

[tasks."pr:create"]
description = "Validate committed HEAD, push tested commit, and create a PR"
run = "go run ./tools/validate pr-create"

[tasks."pr:update"]
description = "Validate committed HEAD and push tested commit"
run = "go run ./tools/validate pr-update"
