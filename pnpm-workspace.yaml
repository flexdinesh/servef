packages:
  - "apps/web"
  - "apps/site"
  - "apps/electron"
  - "packages/contracts"

engineStrict: true
includeWorkspaceRoot: true

# Three-day supply-chain cooling period.
minimumReleaseAge: 4320
# Exact-version exemption for the Mermaid renderer; remove after 2026-10-23.
# Exact-version exemptions for Pierre Highlights (decision 0029); remove after
# 2026-10-25.
minimumReleaseAgeExclude:
  - ondine@0.0.3
  - "@pierre/diffs@1.6.1"
  - "@pierre/highlights@0.2.0"
  - "@pierre/theming@1.0.2"

allowBuilds:
  # Electron downloads its binary only where needed: node apps/electron/node_modules/electron/install.js.
  electron: false
  # Squirrel.Windows helper (electron-builder dep); its install picks a 7z binary for Windows builds only.
  electron-winstaller: false
  es5-ext: false
  esbuild: true
  vue-demi: false

# Exposes React FileDiff's instance for diff anchor reveal and hunk steps
# (decision 0034); drop once Pierre exposes it or a scroll-to-line API.
patchedDependencies:
  '@pierre/diffs@1.6.1': patches/@pierre__diffs@1.6.1.patch
  '@pierre/trees@1.0.0-beta.6': patches/@pierre__trees@1.0.0-beta.6.patch
