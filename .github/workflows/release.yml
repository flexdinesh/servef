name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Select release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force
          release_version="$(go run ./tools/release-version)"
          tag_exists=false
          if tag_commit="$(git rev-list -n 1 "$release_version" 2>/dev/null)"; then
            head_commit="$(git rev-parse HEAD)"
            if [[ "$tag_commit" != "$head_commit" ]]; then
              echo "$release_version points to $tag_commit, not current main $head_commit" >&2
              exit 1
            fi
            tag_exists=true
          fi

          release_exists=false
          if gh release view "$release_version" >/dev/null 2>&1; then
            release_exists=true
          fi

          echo "tag=$release_version" >> "$GITHUB_OUTPUT"
          echo "number=${release_version#v}" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$tag_exists" >> "$GITHUB_OUTPUT"
          echo "release_exists=$release_exists" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          go test ./...
          pnpm test:web
          pnpm test:release
          pnpm typecheck

      - name: Test browser
        run: pnpm test:browser

      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Vet
        run: go vet ./...

      - name: Build
        run: |
          pnpm build:web
          git diff --exit-code -- internal/web/dist
          go build ./...

      - name: Create release tag
        if: steps.version.outputs.tag_exists != 'true'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Build release archives
        if: steps.version.outputs.release_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.number }}"
          commit="$(git rev-parse --short=12 HEAD)"
          date="$(git show -s --format=%cI HEAD)"
          module="github.com/flexdinesh/servef/internal/version"

          rm -rf release-dist
          mkdir -p release-dist

          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            archive_dir="servef_${version}_${goos}_${goarch}"
            mkdir -p "release-dist/${archive_dir}"

            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build \
              -trimpath \
              -ldflags="-s -w -X ${module}.Version=${version} -X ${module}.Commit=${commit} -X ${module}.Date=${date}" \
              -o "release-dist/${archive_dir}/servef" \
              .

            cp README.md LICENSE "release-dist/${archive_dir}/"
            tar -C release-dist -czf "release-dist/${archive_dir}.tar.gz" "${archive_dir}"
            rm -rf "release-dist/${archive_dir}"
          done

          (
            cd release-dist
            shasum -a 256 *.tar.gz > checksums.txt
          )

      - name: Publish GitHub release
        if: steps.version.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          gh release create "$RELEASE_VERSION" \
            release-dist/*.tar.gz \
            release-dist/checksums.txt \
            --target "$(git rev-parse HEAD)" \
            --title "$RELEASE_VERSION" \
            --generate-notes

      - name: Download existing release
        if: steps.version.outputs.release_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf release-dist
          mkdir -p release-dist
          gh release download "${{ steps.version.outputs.tag }}" --dir release-dist

      - name: Check out Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: flexdinesh/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          fetch-depth: 0

      - name: Generate Homebrew formula
        run: |
          pnpm generate:homebrew -- \
            --version "${{ steps.version.outputs.number }}" \
            --tag "${{ steps.version.outputs.tag }}" \
            --checksums release-dist/checksums.txt \
            --output homebrew-tap/Formula/servef.rb

      - name: Validate Homebrew formula syntax
        run: ruby -c homebrew-tap/Formula/servef.rb

      - name: Open Homebrew tap pull request
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.number }}"
          tag="${{ steps.version.outputs.tag }}"
          branch="servef-v${version}"
          tap_repo="flexdinesh/homebrew-tap"

          cd homebrew-tap

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"

          if [[ -z "$(git status --porcelain -- Formula/servef.rb)" ]]; then
            echo "Homebrew formula is already up to date for servef v${version}."
            exit 0
          fi

          git add Formula/servef.rb
          git commit -m "Update servef to v${version}"
          git push --force-with-lease origin "HEAD:${branch}"

          pr_number="$(gh pr list \
            --repo "$tap_repo" \
            --head "$branch" \
            --state open \
            --json number \
            --jq '.[0].number // ""')"

          pr_body="$(mktemp)"
          cat > "$pr_body" <<EOF
          Updates the servef formula to v${version}.

          Source release: https://github.com/flexdinesh/servef/releases/tag/${tag}

          This PR was generated by the servef release workflow.
          EOF

          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" \
              --repo "$tap_repo" \
              --title "Update servef to v${version}" \
              --body-file "$pr_body"
          else
            gh pr create \
              --repo "$tap_repo" \
              --head "$branch" \
              --base main \
              --title "Update servef to v${version}" \
              --body-file "$pr_body"
          fi
