name: Release

# Pushing a vX.Y.Z tag that points at a main commit publishes that stable
# release (decision 0079): check -> build (build.yml) -> publish. The tag is
# the plain main commit; nothing is committed or pushed. A published release
# is never rebuilt or replaced.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      number: ${{ steps.tag.outputs.number }}
      commit: ${{ steps.tag.outputs.commit }}
      published: ${{ steps.tag.outputs.published }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          number='(0|[1-9][0-9]*)'
          if [[ ! "$TAG" =~ ^v${number}\.${number}\.${number}$ ]]; then
            echo "$TAG is not a vX.Y.Z release tag" >&2
            exit 1
          fi
          # Annotated tags resolve to the commit they name.
          commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "$TAG points at $commit, which is not on main" >&2
            exit 1
          fi

          published=false
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published; its assets are never rebuilt."
            published=true
          fi

          {
            echo "tag=$TAG"
            echo "number=${TAG#v}"
            echo "commit=$commit"
            echo "published=$published"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.published != 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.check.outputs.commit }}
      version: ${{ needs.check.outputs.number }}

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download assets
        uses: actions/download-artifact@v8
        with:
          pattern: assets-*
          path: release-dist
          merge-multiple: true

      # Re-checked here, so re-running only this job after a partial failure
      # never replaces a release.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published."
            exit 0
          fi
          gh release create "$TAG" release-dist/* \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            --latest
