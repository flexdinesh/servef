name: Edge

# Each push to main builds the stable asset set (build.yml) without macOS Intel
# (decision 0093), stamped 0.0.0-edge and, once every build job passes, replaces
# the assets of the one `edge` prerelease and moves its tag to that commit
# (decision 0079). Nothing is committed to any branch.
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    # A newer push cancels an older build; publishing is never cancelled.
    concurrency:
      group: edge-build
      cancel-in-progress: true
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
      version: 0.0.0-edge
      retention-days: 3
      macos-arches: arm64

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: edge-publish
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download assets
        uses: actions/download-artifact@v8
        with:
          pattern: assets-*
          path: release-dist
          merge-multiple: true

      # Same names every time, so --clobber replaces each asset in place and
      # downloads keep working while the others upload; names no longer built
      # are deleted afterwards.
      - name: Publish edge prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if git fetch --quiet --no-tags origin +refs/tags/edge:refs/tags/edge 2>/dev/null; then
            current="$(git rev-parse 'refs/tags/edge^{commit}')"
            if [[ "$current" != "$GITHUB_SHA" ]] && git merge-base --is-ancestor "$GITHUB_SHA" "$current"; then
              echo "edge already has newer main $current; skipping $GITHUB_SHA."
              exit 0
            fi
          fi

          git push --no-verify --force origin "${GITHUB_SHA}:refs/tags/edge"

          notes="Latest \`main\` after every green push: ${GITHUB_SHA}. Builds report version 0.0.0-edge and the commit. Install with \`scripts/install-edge.sh\` or \`scripts/install-electron-edge.sh\`; assets are replaced on the next push."
          if gh release view edge >/dev/null 2>&1; then
            gh release edit edge --title edge --notes "$notes" --prerelease --latest=false
          else
            gh release create edge --title edge --notes "$notes" --prerelease --latest=false --verify-tag
          fi

          gh release upload edge release-dist/* --clobber
          mapfile -t published < <(gh release view edge --json assets --jq '.assets[].name')
          for name in "${published[@]}"; do
            if [[ ! -e "release-dist/$name" ]]; then
              gh release delete-asset edge "$name" --yes
            fi
          done
