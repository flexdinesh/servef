name: Build

# Builds every distribution asset for one commit (decision 0079); release.yml
# (stable tags) and ci.yml (the edge prerelease) call it and publish the
# result. cli (Go archives, archive smoke) -> desktop-linux and desktop-macos
# (packages bundling those binaries, smoke checks) -> assets (the expected set,
# checksums.txt). Every job uploads an assets-* artifact; callers download them
# all with pattern assets-*. Nothing is committed or pushed.

on:
  workflow_call:
    inputs:
      ref:
        description: Full commit SHA to build
        required: true
        type: string
      version:
        description: Version stamped into the binaries and packages and used in asset names (X.Y.Z, or 0.0.0-edge)
        required: true
        type: string
      retention-days:
        description: Days to keep the asset artifacts
        required: false
        type: number
        default: 30
      macos-arches:
        description: Space-separated macOS architectures to build; arm64 must be one (the smoke tests run it)
        required: false
        type: string
        default: amd64 arm64

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # Installs Go, Node, and pnpm from mise.lock (decision 0038). Bump
      # `version` with mise.toml min_version.
      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.18

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-dependencies-${{ hashFiles('mise.lock', 'pnpm-lock.yaml', 'apps/servef/go.sum') }}
          restore-keys: ${{ runner.os }}-dependencies-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Checks run locally before push; the build still makes its shipped assets.
      - name: Build frontend
        run: mise run build:web

      - name: Build CLI archives
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          MACOS_ARCHES: ${{ inputs.macos-arches }}
        run: |
          set -euo pipefail

          commit="$(git rev-parse --short=12 HEAD)"
          date="$(git show -s --format=%cI HEAD)"
          module="github.com/flexdinesh/servef/internal/version"

          rm -rf release-dist
          mkdir -p release-dist

          targets=(linux/amd64 linux/arm64)
          for arch in $MACOS_ARCHES; do
            targets+=("darwin/${arch}")
          done
          for target in "${targets[@]}"; do
            goos="${target%/*}"
            goarch="${target#*/}"
            archive_dir="servef_${VERSION}_${goos}_${goarch}"
            mkdir -p "release-dist/${archive_dir}"

            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build \
              -trimpath \
              -ldflags="-s -w -X ${module}.Version=${VERSION} -X ${module}.Commit=${commit} -X ${module}.Date=${date}" \
              -o "release-dist/${archive_dir}/servef" \
              ./apps/servef

            cp README.md LICENSE "release-dist/${archive_dir}/"
            tar -C release-dist -czf "release-dist/${archive_dir}.tar.gz" "${archive_dir}"
            rm -rf "release-dist/${archive_dir}"
          done

      # Run the shipped linux/amd64 binary: version stamp and embedded UI.
      - name: Smoke test CLI archive
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          dir="$(mktemp -d)"
          tar -C "$dir" -xzf "release-dist/servef_${VERSION}_linux_amd64.tar.gz"
          bin="$dir/servef_${VERSION}_linux_amd64/servef"
          "$bin" --version | grep -F "servef ${VERSION} $(git rev-parse --short=12 HEAD) "
          "$bin" "$dir" --port 7999 --no-open &
          trap 'kill $!' EXIT
          for _ in $(seq 50); do curl -fsS -o /dev/null http://127.0.0.1:7999/ && break; sleep 0.2; done
          curl -fsS http://127.0.0.1:7999/ | grep -q '<div id="root"'

      - name: Upload CLI archives
        uses: actions/upload-artifact@v7
        with:
          name: assets-archives
          path: release-dist/*.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
          compression-level: 0

  # The desktop app (decisions 0094, 0095) bundles the archives' Go binary as
  # resources/bin/servef. mygo needs no cgo, so one Linux runner builds both
  # architectures. apps/desktop needs Go 1.27: GOTOOLCHAIN fetches the toolchain
  # go.mod names, verified against sum.golang.org.
  desktop-linux:
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.18

      - name: Download CLI archives
        uses: actions/download-artifact@v8
        with:
          name: assets-archives
          path: release-dist

      - name: Package desktop app
        env:
          VERSION: ${{ inputs.version }}
          GOTOOLCHAIN: go1.27.3
        run: apps/desktop/scripts/package.sh linux "$VERSION" release-dist desktop-dist

      # amd64 only: the runner cannot execute arm64 binaries.
      - name: Smoke test desktop packages
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          dir="$(mktemp -d)"
          tar -C "$dir" -xzf "desktop-dist/servef-desktop_${VERSION}_linux_amd64.tar.gz"
          "$dir/servef-desktop" --version | grep -Fx "servef-desktop ${VERSION} $(git rev-parse --short=12 HEAD)"
          "$dir/bin/servef" --version | grep -F "servef ${VERSION} "
          grep -E '^MimeType=(.*;)?x-scheme-handler/servef(;|$)' "$dir/servef-desktop.desktop"
          test -f "$dir/servef-desktop.png"

      - name: Upload desktop packages
        uses: actions/upload-artifact@v7
        with:
          name: assets-desktop-linux
          path: desktop-dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
          compression-level: 0

  # Ad-hoc signed (mygo.json macos.signingIdentity "-"); signing needs macOS.
  desktop-macos:
    needs: cli
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.18

      - name: Download CLI archives
        uses: actions/download-artifact@v8
        with:
          name: assets-archives
          path: release-dist

      - name: Package desktop app
        env:
          VERSION: ${{ inputs.version }}
          MACOS_ARCHES: ${{ inputs.macos-arches }}
          GOTOOLCHAIN: go1.27.3
        run: apps/desktop/scripts/package.sh darwin "$VERSION" release-dist desktop-dist "$MACOS_ARCHES"

      # arm64 only: macos-latest runs on Apple silicon.
      - name: Smoke test desktop packages
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          dir="$(mktemp -d)"
          ditto -x -k "desktop-dist/servef-desktop_${VERSION}_darwin_arm64.zip" "$dir"
          app="$dir/servef-desktop.app/Contents"
          "$app/MacOS/servef-desktop" --version | grep -Fx "servef-desktop ${VERSION} $(git rev-parse --short=12 HEAD)"
          "$app/Resources/bin/servef" --version | grep -F "servef ${VERSION} "
          codesign --verify "$dir/servef-desktop.app"
          scheme="$(plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw -o - "$app/Info.plist")"
          if [[ "$scheme" != "servef" ]]; then
            echo "Info.plist registers URL scheme '$scheme', want servef" >&2
            exit 1
          fi

      - name: Upload desktop packages
        uses: actions/upload-artifact@v7
        with:
          name: assets-desktop-macos
          path: desktop-dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
          compression-level: 0

  assets:
    needs: [cli, desktop-linux, desktop-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download assets
        uses: actions/download-artifact@v8
        with:
          pattern: assets-*
          path: release-dist
          merge-multiple: true

      # The install scripts (decision 0073) download these names; renaming one
      # breaks them for every user at once.
      - name: Check assets and write checksums
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          MACOS_ARCHES: ${{ inputs.macos-arches }}
        run: |
          set -euo pipefail

          expected=()
          for arch in amd64 arm64; do
            expected+=(
              "servef_${VERSION}_linux_${arch}.tar.gz"
              "servef-desktop_${VERSION}_linux_${arch}.tar.gz"
            )
          done
          for arch in $MACOS_ARCHES; do
            expected+=(
              "servef_${VERSION}_darwin_${arch}.tar.gz"
              "servef-desktop_${VERSION}_darwin_${arch}.zip"
            )
          done

          cd release-dist
          diff <(printf '%s\n' "${expected[@]}" | sort) <(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          mkdir -p ../checksums
          shasum -a 256 "${expected[@]}" > ../checksums/checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: assets-checksums
          path: checksums/checksums.txt
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
